name: Hillsborough Intel — Daily Scrape & Deploy

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    name: Scrape Hillsborough Clerk
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper/fetch.py

      - name: Commit updated records
        run: |
          git config --global user.name  "hillsborough-intel[bot]"
          git config --global user.email "hillsborough-intel[bot]@users.noreply.github.com"
          git add dashboard/records.json data/records.json data/ || true
          git diff --cached --quiet || git commit -m "data: daily refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

  deploy:
    name: Deploy GitHub Pages
    needs: scrape
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout (with fresh data)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
